<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Praca domowa Kalkulator mod 4</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>

<body class="body">
    <div class="body__container">
        <form class="form js-form">
            <h1 class="form__header">
                Kalkulator walut
            </h1>
            <p>
                <label>
                    <span class="form__labelText">
                        Kwota w złotych*:
                    </span>
                    <input type="number" placeholder="Wpisz kwotę w zł" class="form__field amount js-amount" required
                        step="0.01">
                </label>
            </p>

            <p>
                <label>
                    <span class="form__labelText">
                        Waluta pieniężna::
                    </span>
                    <select name="currency" class="form__field currencySelect js-currency">
                        <option value="EUR">Euro</option>
                        <option value="GBP">Funt Brytyjski</option>
                        <option value="USD">Dolar Amerykański</option>
                    </select>


                </label>
            </p>
            <p>
                <button class="button js-button">Przelicz</button>
            </p>
            <p class="form__Info">
                Kursy średnie walut obcych – tabela A
                bieżące kursy średnie walut obcych w złotych określonych w § 2 ust. 1 pkt 1 i 2 uchwały Nr 44/2025
                Zarządu Narodowego Banku Polskiego z dnia 18 grudnia 2025 r.
            </p>
            <p class="js-result form__result">
                <strong></strong>
            </p>
        </form>

        <!-- film stop 15m 49s -->
    </div>
</body>

</html>
